name: check

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        nvim: ["0.11.7", "0.12.5"]
    steps:
      - uses: actions/checkout@v7

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl git jq qml6-module-qtquick qml6-module-qtqml-workerscript \
            qt6-base-dev-tools qt6-declarative-dev-tools qt6-qmllint-plugins \
            qt6-qmltooling-plugins ripgrep rsync unzip

      - name: Install Neovim
        run: |
          curl -fsSL \
            "https://github.com/neovim/neovim/releases/download/v${{ matrix.nvim }}/nvim-linux-x86_64.tar.gz" \
            -o "$RUNNER_TEMP/nvim.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "NVIM=$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" >> "$GITHUB_ENV"

      - name: Install Lua tools
        run: |
          curl -fsSL \
            https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip \
            -o "$RUNNER_TEMP/stylua.zip"
          mkdir -p "$RUNNER_TEMP/stylua" "$RUNNER_TEMP/luals"
          unzip -q "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP/stylua"
          curl -fsSL \
            https://github.com/LuaLS/lua-language-server/releases/download/3.18.2/lua-language-server-3.18.2-linux-x64.tar.gz \
            -o "$RUNNER_TEMP/luals.tar.gz"
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          echo "LUALS=$RUNNER_TEMP/luals/bin/lua-language-server" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/stylua" >> "$GITHUB_PATH"

      - name: Install coverage tools
        if: matrix.nvim == '0.12.5'
        run: |
          sudo apt-get install -y gcc liblua5.1-0-dev luarocks
          luarocks --lua-version=5.1 --tree="$RUNNER_TEMP/coverage-rocks" install luacov 0.17.0-1
          luarocks --lua-version=5.1 --tree="$RUNNER_TEMP/coverage-rocks" install luafilesystem 1.8.0-1

      - name: Test
        if: matrix.nvim == '0.11.7'
        run: ./scripts/test

      - name: Test with coverage
        if: matrix.nvim == '0.12.5'
        env:
          LUA_PATH: "${{ runner.temp }}/coverage-rocks/share/lua/5.1/?.lua;${{ runner.temp }}/coverage-rocks/share/lua/5.1/?/init.lua;;"
          LUA_CPATH: "${{ runner.temp }}/coverage-rocks/lib/lua/5.1/?.so;;"
        run: ./scripts/test --coverage

      - name: Check formatting
        run: stylua --check ftdetect lua plugin tests

      - name: Check Lua types
        run: ./scripts/check-lua

      - name: Upload Lua coverage
        if: >-
          matrix.nvim == '0.12.5' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          disable_search: true
          fail_ci_if_error: true
          files: coverage/luacov.report.out
          flags: lua
          name: lua
          use_oidc: true
